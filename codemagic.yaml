workflows:
  ios-ci-check:
    name: Moonlight Mix — iOS CI Check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: com.davidwis.moonlightmix
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Type-check and build web app
        script: npm run build
      - name: Create and sync Capacitor iOS project
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned iOS simulator app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - dist/**
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/*.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
