workflows:
  ios-testflight:
    name: Moonlight Mix — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: moonlight_mix_apple

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.davidwis.moonlightmix
      vars:
        BUNDLE_ID: com.davidwis.moonlightmix
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Type-check and build web app
        script: npm run build

      - name: Create and sync Capacitor iOS project
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          cd ios/App
          pod install

      - name: Apply uploaded signing files
        script: xcode-project use-profiles

      - name: Set unique build number
        script: |
          cd ios/App
          agvtool new-version -all "$CM_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
