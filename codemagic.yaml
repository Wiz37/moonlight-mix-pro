workflows:
  ios-ci-check:
    name: Moonlight Mix — iOS CI Check
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.davidwis.moonlightmix

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Type-check and build web app
        script: npm run build

      - name: Create and sync Capacitor iOS project
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          cd ios/App
          pod install

      - name: Build unsigned iOS simulator app
        script: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/xcodebuild.log

    artifacts:
      - dist/**
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild.log

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
