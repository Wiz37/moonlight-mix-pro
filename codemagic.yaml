workflows:
  ios-testflight:
    name: Moonlight Mix — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: moonlight_mix_apple

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.davidwis.moonlightmix
      vars:
        BUNDLE_ID: com.davidwis.moonlightmix
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Type-check and build web app
        script: npm run build

      - name: Create and sync Capacitor iOS project
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          cd ios/App
          pod install

      - name: Apply uploaded signing files
        script: xcode-project use-profiles

      - name: Set valid iOS build number
        script: |
    #!/usr/bin/env bash
    set -euo pipefail

    IOS_BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"

    if ! [[ "$IOS_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
      echo "Invalid iOS build number: $IOS_BUILD_NUMBER"
      exit 1
    fi

    echo "Setting iOS build number to $IOS_BUILD_NUMBER"

    /usr/libexec/PlistBuddy \
      -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" \
      ios/App/App/Info.plist

    /usr/libexec/PlistBuddy \
      -c "Set :CFBundleShortVersionString 1.0.0" \
      ios/App/App/Info.plist

    echo "Verified versions:"
    /usr/libexec/PlistBuddy \
      -c "Print :CFBundleVersion" \
      ios/App/App/Info.plist

    /usr/libexec/PlistBuddy \
      -c "Print :CFBundleShortVersionString" \
      ios/App/App/Info.plist

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
